# disTokoloshe Docker Compose
# Usage:
#   1. Run ./infra/scripts/init.sh to generate .env with secrets
#   2. docker compose build
#   3. docker compose up -d
#
# For production TLS:
#   4. Set DOMAIN and ACME_EMAIL in .env
#   5. Run ./infra/scripts/init-certs.sh to get initial Let's Encrypt cert
#   6. docker compose up -d  (certbot container handles renewal)

networks:
  app_net:
    driver: bridge

services:

  # ── Web (nginx — SPA + reverse proxy + TLS) ────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: distokoloshe_web
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3080}:80"
      - "${WEB_TLS_PORT:-3443}:443/tcp"
      - "${WEB_TLS_PORT:-3443}:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./data/certs:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || wget --no-check-certificate -qO/dev/null https://127.0.0.1:443/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_net

  # ── API (Node.js — auth + rooms + LiveKit tokens) ──────
  api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: distokoloshe_api
    restart: unless-stopped
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - E2EE_SECRET=${E2EE_SECRET:-}   # legacy: only seeds keys for rooms that predate per-room keys
      - LIVEKIT_URL=ws://host.docker.internal:${LK_PORT:-7881}
      - MUSIC_ROOM_NAME=${MUSIC_ROOM_NAME:-Music}
      - SERVER_CITY=${SERVER_CITY:-}
      - SERVER_GEO=${SERVER_GEO:-}     # "off" skips the IP location lookup
      - DOMAIN=${DOMAIN:-}             # its DNS record shows when the server's IP changes
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/api:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:3000:3000"   # Host-networked services reach the API here: music bot + LiveKit webhooks
    networks:
      - app_net

  # ── Music Bot (DJ Tokoloshe — Python + FFmpeg/yt-dlp) ──
  # Host networking: :3001 is not firewalled by Docker. Every endpoint except
  # /health requires the internal key the API derives from LIVEKIT_API_SECRET.
  music:
    build:
      context: ./apps/music
      dockerfile: Dockerfile
    container_name: distokoloshe_music
    restart: unless-stopped
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=ws://127.0.0.1:${LK_PORT:-7881}
      - MUSIC_ROOM_NAME=${MUSIC_ROOM_NAME:-Music}
      - API_URL=http://127.0.0.1:3000

  # ── LiveKit SFU (WebRTC media relay + built-in TURN) ───
  # Uses host networking so WebRTC ICE candidates work correctly.
  # Ports bound directly: 7881 (WS/API — keep closed, nginx proxies it), 7882 (ICE/TCP),
  # 50201-50400 (UDP), 3478 (TURN), 5349 (TURN/TLS)
  livekit:
    build:
      context: ./infra/livekit
      dockerfile: Dockerfile
    container_name: distokoloshe_livekit
    restart: unless-stopped
    network_mode: host
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}   # webhook signing key (see livekit.yaml)
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./data/certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "--timeout=3", "http://127.0.0.1:${LK_PORT:-7881}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Certbot (Let's Encrypt cert renewal) ────────────────
  # Only needed in production. Renews certs every 12 hours.
  # nginx detects the updated cert and reloads itself automatically; LiveKit (TURN/TLS)
  # needs a restart — see "Certificate Renewal" in README.md.
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: distokoloshe_certbot
    restart: unless-stopped
    volumes:
      - ./data/certs:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    profiles:
      - production
    networks:
      - app_net
