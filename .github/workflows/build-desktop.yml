name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Stage ffmpeg + yt-dlp sidecars (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned: bump both together (asset digest from the GyanD/codexffmpeg release)
          FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
          FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'   # progress bar makes Invoke-WebRequest crawl
          $triple = (rustc -vV | Select-String '^host: ').ToString().Split(' ')[1]
          $dir = "apps/desktop/src-tauri"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Write-Host "Target triple: $triple"

          $ffmpegZip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $ffmpegZip
          $actual = (Get-FileHash $ffmpegZip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:FFMPEG_SHA256) { throw "ffmpeg checksum mismatch: got $actual" }
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:RUNNER_TEMP/ffmpeg-extract" -Force
          $ffmpegExe = Get-ChildItem -Path "$env:RUNNER_TEMP/ffmpeg-extract" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found in extracted archive" }
          Copy-Item $ffmpegExe.FullName "$dir/ffmpeg-$triple.exe"

          # yt-dlp: newest release (it has to stay current), verified against that release's checksums
          $tag = gh release view --repo yt-dlp/yt-dlp --json tagName --jq .tagName
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile "$env:RUNNER_TEMP/SHA2-256SUMS"
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile "$dir/yt-dlp-$triple.exe"
          $line = Get-Content "$env:RUNNER_TEMP/SHA2-256SUMS" | Where-Object { $_ -match '\s+yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw "yt-dlp.exe not listed in SHA2-256SUMS" }
          $expected = ($line -split '\s+')[0].ToLower()
          $actualYt = (Get-FileHash "$dir/yt-dlp-$triple.exe" -Algorithm SHA256).Hash.ToLower()
          if ($actualYt -ne $expected) { throw "yt-dlp checksum mismatch: got $actualYt, expected $expected" }
          Write-Host "yt-dlp $tag verified"

          # Verify both staged binaries exist with the exact names Tauri expects
          if (-not (Test-Path "$dir/ffmpeg-$triple.exe")) { throw "missing ffmpeg sidecar" }
          if (-not (Test-Path "$dir/yt-dlp-$triple.exe")) { throw "missing yt-dlp sidecar" }
          Get-ChildItem $dir | Where-Object { $_.Name -like 'ffmpeg-*' -or $_.Name -like 'yt-dlp-*' } | Format-Table Name, Length

      - name: Build desktop app
        # Manual test builds get the web inspector; tagged releases don't
        run: npx tauri build ${{ !startsWith(github.ref, 'refs/tags/') && '--features devtools' || '' }}
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: distokoloshe-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 30

  build-macos:
    runs-on: macos-latest   # Apple Silicon runner -> native arm64 build
    permissions:
      contents: write
    env:
      # A step's own env isn't visible in its `if`, and secrets can't be used there —
      # expose only whether the cert exists.
      HAS_MACOS_CERT: ${{ secrets.MACOS_SIGNING_CERT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Stage ffmpeg + yt-dlp sidecars (macOS)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned native arm64 build (system frameworks only, macOS 12+) from
          # ffmpeg.martin-riedl.de — bump URL + SHA256 together (the .sha256 is published
          # next to each build). evermeet.cx was Intel-only and has since gone (HTTP 410).
          FFMPEG_URL: https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip
          FFMPEG_SHA256: c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/host: //p')"
          dir="apps/desktop/src-tauri"
          mkdir -p "$dir"
          echo "Target triple: $triple"

          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.zip" | shasum -a 256 -c -
          unzip -o "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg-extract"
          cp "$RUNNER_TEMP/ffmpeg-extract/ffmpeg" "$dir/ffmpeg-$triple"
          chmod +x "$dir/ffmpeg-$triple"

          # yt-dlp: newest release (it has to stay current), verified against that release's checksums
          tag="$(gh release view --repo yt-dlp/yt-dlp --json tagName --jq .tagName)"
          base="https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          curl -fsSL -o "$RUNNER_TEMP/SHA2-256SUMS" "$base/SHA2-256SUMS"
          curl -fsSL -o "$dir/yt-dlp-$triple" "$base/yt-dlp_macos"
          expected="$(awk '$2 == "yt-dlp_macos" {print $1}' "$RUNNER_TEMP/SHA2-256SUMS")"
          test -n "$expected" || { echo "yt-dlp_macos not listed in SHA2-256SUMS"; exit 1; }
          echo "$expected  $dir/yt-dlp-$triple" | shasum -a 256 -c -
          chmod +x "$dir/yt-dlp-$triple"

          # Apple Silicon native only — never ship something that needs Rosetta
          for bin in "$dir/ffmpeg-$triple" "$dir/yt-dlp-$triple"; do
            file "$bin"
            file "$bin" | grep -q "arm64" || { echo "$bin is not native arm64"; exit 1; }
          done

          # Verify both staged binaries exist with the exact names Tauri expects
          test -f "$dir/ffmpeg-$triple" || { echo "missing ffmpeg sidecar"; exit 1; }
          test -f "$dir/yt-dlp-$triple" || { echo "missing yt-dlp sidecar"; exit 1; }
          ls -la "$dir"/ffmpeg-* "$dir"/yt-dlp-*

      - name: Build desktop app
        # Manual test builds get the web inspector; tagged releases don't
        run: npx tauri build ${{ !startsWith(github.ref, 'refs/tags/') && '--features devtools' || '' }}
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Codesign macOS app
        if: env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_NAME="${MACOS_CERT_IDENTITY:-disTokoloshe Self-Signed}"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MACOS_SIGNING_CERT" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          APP_PATH=$(find apps/desktop/src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --force --deep --sign "$CERT_NAME" --entitlements apps/desktop/src-tauri/Entitlements.plist "$APP_PATH"
            codesign --verify "$APP_PATH" && echo "Signature verified: $APP_PATH"

            # Re-package signed app for updater
            TAR_PATH=$(find apps/desktop/src-tauri/target/release/bundle/macos -name "*.app.tar.gz" | head -1)
            if [ -n "$TAR_PATH" ]; then
              APP_NAME=$(basename "$APP_PATH")
              tar -czf "$TAR_PATH" -C "$(dirname "$APP_PATH")" "$APP_NAME"
              echo "Re-packaged signed app"
              # The updater signature covers the tarball's bytes, so the one from the
              # build no longer matches — sign the new tarball (writes $TAR_PATH.sig).
              (cd apps/desktop && npx tauri signer sign "$GITHUB_WORKSPACE/$TAR_PATH")
            fi

            # The .dmg was built before codesigning — rebuild it around the signed app
            DMG_PATH=$(find apps/desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
            if [ -n "$DMG_PATH" ]; then
              STAGE="$RUNNER_TEMP/dmg-stage"
              rm -rf "$STAGE" && mkdir -p "$STAGE"
              cp -R "$APP_PATH" "$STAGE/"
              ln -s /Applications "$STAGE/Applications"
              rm -f "$DMG_PATH"
              hdiutil create -volname "disTokoloshe" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
              echo "Rebuilt $DMG_PATH with the signed app"
            fi
          fi
          rm -f $RUNNER_TEMP/cert.p12

      - name: Name macOS updater bundle by architecture
        shell: bash
        run: |
          set -euo pipefail
          # Tauri names it disTokoloshe.app.tar.gz (no arch); the server's release sync
          # needs the arch in the filename to file it under darwin-aarch64.
          arch="$(uname -m | sed 's/^arm64$/aarch64/')"
          cd apps/desktop/src-tauri/target/release/bundle/macos
          for f in *.app.tar.gz; do
            base="${f%.app.tar.gz}"
            mv "$f" "${base}_${arch}.app.tar.gz"
            mv "$f.sig" "${base}_${arch}.app.tar.gz.sig"
          done
          ls -la

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: distokoloshe-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Stage ffmpeg + yt-dlp sidecars (Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned x86_64 build from ffmpeg.martin-riedl.de (needs glibc 2.35 / GCC 12
          # libstdc++ — same baseline as this ubuntu-22.04 AppImage). Bump URL + SHA256
          # together; the .sha256 is published next to each build.
          FFMPEG_URL: https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2/ffmpeg.zip
          FFMPEG_SHA256: fa8ecf4abbd290d98f7d188b8649cc6b391ae209a98452be955a15aab1909d7f
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/host: //p')"
          dir="apps/desktop/src-tauri"
          mkdir -p "$dir"
          echo "Target triple: $triple"

          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg-extract"
          cp "$RUNNER_TEMP/ffmpeg-extract/ffmpeg" "$dir/ffmpeg-$triple"
          chmod +x "$dir/ffmpeg-$triple"

          # yt-dlp: newest release (it has to stay current), verified against that release's checksums
          tag="$(gh release view --repo yt-dlp/yt-dlp --json tagName --jq .tagName)"
          base="https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          curl -fsSL -o "$RUNNER_TEMP/SHA2-256SUMS" "$base/SHA2-256SUMS"
          curl -fsSL -o "$dir/yt-dlp-$triple" "$base/yt-dlp_linux"
          expected="$(awk '$2 == "yt-dlp_linux" {print $1}' "$RUNNER_TEMP/SHA2-256SUMS")"
          test -n "$expected" || { echo "yt-dlp_linux not listed in SHA2-256SUMS"; exit 1; }
          echo "$expected  $dir/yt-dlp-$triple" | sha256sum -c -
          chmod +x "$dir/yt-dlp-$triple"

          # Verify both staged binaries exist with the exact names Tauri expects
          test -f "$dir/ffmpeg-$triple" || { echo "missing ffmpeg sidecar"; exit 1; }
          test -f "$dir/yt-dlp-$triple" || { echo "missing yt-dlp sidecar"; exit 1; }
          ls -la "$dir"/ffmpeg-* "$dir"/yt-dlp-*

      - name: Build desktop app
        # Manual test builds get the web inspector; tagged releases don't
        run: npx tauri build ${{ !startsWith(github.ref, 'refs/tags/') && '--features devtools' || '' }}
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: distokoloshe-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.sig' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
