# Development config (HTTP only) — used when no TLS certs exist

# Like nginx's default "main" format, but logs $uri instead of $request so query
# strings (EventSource / WebSocket ?token= auth) never reach the access log.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log noquery;

    root /app;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Pipe WS (client-decoded audio upload) — needs Upgrade headers and long timeout.
    # Must come before the generic /api/ block so nginx matches it first.
    location = /api/music/pipe {
        proxy_pass http://api:3000/api/music/pipe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Internal-only endpoints (LiveKit webhooks; the music bot's notifications and room
    # key) are called on the API directly at 127.0.0.1:3000, never through nginx.
    location ~ ^/api/(livekit/webhook|music/notify|music/room-key)$ {
        return 404;
    }

    # API proxy (including SSE — needs long timeout + no buffering)
    location /api/ {
        # Room for 4MB chat images (nginx defaults to 1MB). Each route still enforces
        # its own limit in the API — JSON bodies are capped at 16KB there.
        client_max_body_size 5m;

        # CORS for desktop client (Tauri origins per platform)
        set $cors "";
        if ($http_origin = "tauri://localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "http://tauri.localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "https://tauri.localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "http://localhost:1420") {
            set $cors $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        include /etc/nginx/snippets/security-headers.conf;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # LiveKit WebSocket signaling proxy (host network mode — accessed via host gateway)
    location /livekit/ {
        proxy_pass http://host.docker.internal:7881/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Container healthcheck (compose.yml): plain HTTP on 127.0.0.1, no redirect, no TLS,
    # not logged — so it doesn't fill the log every 30 s
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt ACME challenge (used during cert bootstrapping)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Browsers ask for /favicon.ico regardless; ours is favicon.svg (linked from
    # index.html), so answer the probe with a quiet 404 instead of an error log line
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # SPA fallback. index.html must be revalidated on every load, or browsers keep running
    # the previous build's hashed bundle after a rebuild (re-include security headers).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache static assets (re-include security headers — see security-headers.conf)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
