# Development config (HTTP only) — used when no TLS certs exist

# Like nginx's default "main" format, but logs $uri instead of $request so query
# strings (EventSource / WebSocket ?token= auth) never reach the access log.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log noquery;

    root /app;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Pipe WS (client-decoded audio upload) — needs Upgrade headers and long timeout.
    # Must come before the generic /api/ block so nginx matches it first.
    location = /api/music/pipe {
        proxy_pass http://api:3000/api/music/pipe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # API proxy (including SSE — needs long timeout + no buffering)
    location /api/ {
        # CORS for desktop client (Tauri origins per platform)
        set $cors "";
        if ($http_origin = "tauri://localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "http://tauri.localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "https://tauri.localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "http://localhost:1420") {
            set $cors $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        include /etc/nginx/snippets/security-headers.conf;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # LiveKit WebSocket signaling proxy (host network mode — accessed via host gateway)
    location /livekit/ {
        proxy_pass http://host.docker.internal:7881/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Let's Encrypt ACME challenge (used during cert bootstrapping)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (re-include security headers — see security-headers.conf)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
