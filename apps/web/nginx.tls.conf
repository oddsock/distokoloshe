# Production config (HTTPS + HSTS + HTTP/2 + HTTP/3)
# ${DOMAIN} is substituted by entrypoint.sh via envsubst

# Like nginx's default "main" format, but logs $uri instead of $request so query
# strings (EventSource / WebSocket ?token= auth) never reach the access log.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name ${DOMAIN};

    access_log /var/log/nginx/access.log noquery;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen 443 quic reuseport;          # HTTP/3 (QUIC over UDP)
    http2 on;

    server_name ${DOMAIN};

    access_log /var/log/nginx/access.log noquery;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Modern TLS config (TLS 1.2+ only, strong ciphers)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling — validates cert without contacting CA each time
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /app;
    index index.html;

    # Security headers + HSTS (2 years) + HTTP/3 advertisement
    include /etc/nginx/snippets/security-headers-tls.conf;

    # Pipe WS (client-decoded audio upload) — needs Upgrade headers and long timeout.
    # Must come before the generic /api/ block so nginx matches it first.
    location = /api/music/pipe {
        proxy_pass http://api:3000/api/music/pipe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # API proxy (including SSE — needs long timeout + no buffering)
    location /api/ {
        # CORS for desktop client (Tauri origins per platform)
        set $cors "";
        if ($http_origin = "tauri://localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "http://tauri.localhost") {
            set $cors $http_origin;
        }
        if ($http_origin = "https://tauri.localhost") {
            set $cors $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        include /etc/nginx/snippets/security-headers-tls.conf;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # LiveKit WebSocket signaling proxy (host network mode — accessed via host gateway)
    location /livekit/ {
        proxy_pass http://host.docker.internal:7881/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (re-include security headers — see security-headers.conf)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers-tls.conf;
    }
}
